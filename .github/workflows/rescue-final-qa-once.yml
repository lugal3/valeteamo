name: QA final rescate PC y móvil (temporal, sin publicar)
on:
  push:
    branches: [codex/pulido-rescate-fases-20261115]
    paths:
      - '.github/workflows/rescue-final-qa-once.yml'
      - 'tests/prologue-desktop.cjs'
      - 'src/demo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pruebas unitarias, cinemáticas y mapa original
        run: npm ci && npm test
      - name: Compilar la web para producción
        run: npm run build
      - name: Instalar navegador de QA
        run: npx playwright install chromium --with-deps
      - name: Desktop - teclado, disparos y transición Pokémon
        run: node tests/prologue-desktop.cjs
      - name: Móvil - 4 escenarios, Luis, pistas y casa 3D
        run: node tests/prologue-browser.cjs
      - name: Entrada y controles del 3D
        run: node tests/emotes-browser.cjs
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescate-fase3-pc-movil
          path: artifacts/
          if-no-files-found: ignore
