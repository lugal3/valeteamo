name: Lois PS2 B - rama de desarrollo
on:
  push:
    branches:
      - feature/lois-ps2-option-b-rig
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probar contrato de apariencia y estados
        run: node tests/lois-ps2-profile.cjs
      - name: Verificar malla, continuidad y presupuestos 3D
        run: node tests/lois-ps2-mesh.cjs
      - name: Verificar mapeado UV y aislamiento de texturas
        run: node tests/lois-ps2-uv.cjs
      - name: Probar rig de 21 huesos y retarget facial/corporal
        run: node tests/lois-ps2-rig.cjs
      - name: Probar cámaras de rescate y reacciones de Lois
        run: node tests/lois-ps2-cinematics.cjs
      - name: Probar rescate y animaciones existentes
        run: node tests/rc-car.cjs
      - name: Verificar todas las pruebas
        run: npm test
      - name: Compilar y verificar tipos
        run: npm run build
      - name: Instalar navegador WebGL
        run: npx playwright install chromium --with-deps
      - name: Capturar vistas frontal, lateral, 3/4 y modelo anterior
        run: node tests/lois-ps2-browser.cjs
      - name: Estrés GPU simulado móvil, cambio de calidad y reingreso a la casa
        run: node tests/lois-ps2-stress-browser.cjs
      - name: Recorrido real del rescate completo (casa, sótano, escondite, RC)
        run: node tests/rc-browser.cjs
      - name: Guardar capturas comparativas de Lois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lois-ps2-b-stage6-final-qa
          path: |
            artifacts/lois-*.png
            artifacts/lois-phase6-stress.json
            docs/capturas/rc-finale/*.png
          if-no-files-found: ignore
