name: Comprobar carga de escenas en Safari (producción)
on:
  push:
    branches: [fix/ios-scene-loading]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Comprobar acceso LP, universo, 2D y 3D con HTML compilado
        run: node tests/ios-production-smoke.cjs
