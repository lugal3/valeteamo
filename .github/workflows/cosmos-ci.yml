name: Verificar experiencia cósmica (sin publicar)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/experience/**'
      - 'src/BirthdayCountdown.tsx'
      - 'src/main.tsx'
      - 'src/StoryGame.tsx'
      - 'src/LandscapeGate.tsx'
      - 'src/landscape-gate.css'
      - 'src/StoryApp.tsx'
      - 'src/demo/**'
      - 'src/lab/phone-content.js'
      - 'tests/prologue.cjs'
      - 'tests/prologue-browser.cjs'
      - 'tests/emotes-browser.cjs'
      - 'tests/rescue-world.cjs'
      - 'src/iso-game.ts'
      - 'src/lab/house.js'
      - 'src/lab/house.css'
      - 'package.json'
      - 'src/PlaytestMenu.tsx'
      - 'src/birthday-countdown.css'
      - 'tests/cosmos.cjs'
      - 'tests/galaxy-arrival.cjs'
      - 'tests/tunnel-perspective.cjs'
      - 'tests/cosmos-public-flow.cjs'
      - 'tests/cosmos-browser.cjs'
      - 'tests/landscape-gate.cjs'
      - 'tests/birthday-icon-assets.cjs'
      - 'public/experience/icons/**'
      - '.github/workflows/cosmos-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/cosmos.cjs
      - run: node tests/galaxy-arrival.cjs
      - run: node tests/tunnel-perspective.cjs
      - run: node tests/birthday-icon-assets.cjs
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: node tests/landscape-gate.cjs
      - run: node tests/cosmos-browser.cjs
      - run: node tests/cosmos-public-flow.cjs
      - run: node tests/prologue-browser.cjs
      - run: node tests/emotes-browser.cjs
      - name: Guardar capturas de la experiencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-visual-check
          path: artifacts/
          if-no-files-found: ignore
