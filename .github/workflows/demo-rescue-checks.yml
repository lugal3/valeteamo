name: Validar demo de rescate (sin publicar)
on:
  push:
    branches: [feature/demo-rescate-2d-3d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Instalar Chromium para pruebas visuales
        run: npx playwright install chromium --with-deps
      - name: Probar recorrido en navegador y tomar capturas
        run: node tests/demo-browser.cjs
      - name: Regresión de aventura original en Chromium
        run: npm run test:browser
      - name: Guardar capturas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valeteamo-demo-capturas
          path: demo-screenshots/
          if-no-files-found: ignore
