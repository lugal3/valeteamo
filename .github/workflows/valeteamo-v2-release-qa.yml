name: ValeTeAmo V2 — auditoría integral (sin publicar)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/VALETEAMO-V2-DEFECT-AUDIT.md'
      - '.github/workflows/valeteamo-v2-release-qa.yml'
      - '.github/workflows/v31-size.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valeteamo-v2-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  automated:
    name: Código, puzles, colisiones y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Todas las pruebas de lógica
        run: npm test
      - name: Alcance real de objetivos y rutas entre pisos
        run: node tests/house-space-audit.cjs
      - name: Movimiento, perseguidor y sótano (rendimiento)
        run: npm run test:perf
      - name: Compilar frontend real
        run: npm run build
  playthrough:
    name: Navegador ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - 2d-story
          - 3d-checkpoints
          - rc-rescue
          - threat-hide
          - emy-emergency
          - mobile-input
          - 3d-production
          - emy-mobile
          - emy-desktop
          - emy-webkit
          - subtle-glows
          - altar
          - lois-portrait
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar navegador de prueba
        run: npx playwright install chromium webkit --with-deps
      - name: Install FFmpeg for optimized production test
        if: matrix.scenario == '3d-production' && github.head_ref == 'feature/v31-telefono-historia-final-perf'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Preparar compilación para escenarios de producción
        if: matrix.scenario == '3d-production'
        run: npm run build
        env:
          VALE_REQUIRE_FLAC: ${{ github.head_ref == 'feature/v31-telefono-historia-final-perf' && '1' || '0' }}
      - name: Recorrer escenario
        env:
          ALTAR_QA_ONLY: ${{ matrix.scenario == 'altar' && '1' || '0' }}
          EMY_QA_DIR: artifacts/v2/${{ matrix.scenario }}
          EMY_QA_VIEWPORT: ${{ matrix.scenario == 'emy-desktop' && 'desktop' || 'mobile' }}
          EMY_QA_ENGINE: ${{ matrix.scenario == 'emy-webkit' && 'webkit' || 'chromium' }}
          V2_GLOW_QA_DIR: artifacts/v2/subtle-glows
          RC_QA_DIR: artifacts/v2/rc-rescue
          CHECKPOINT_QA_DIR: artifacts/v2/3d-checkpoints
          HOUSE_THREAT_QA_DIR: artifacts/v2/threat-hide
          EMERGENCY_QA_DIR: artifacts/v33-emergency
          HOUSE_INPUT_QA_DIR: artifacts/v2/mobile-input
        run: |
          case "${{ matrix.scenario }}" in
            2d-story) node tests/prologue-browser.cjs && node tests/prologue-desktop.cjs ;;
            3d-checkpoints) node tests/house-checkpoint-browser.cjs ;;
            rc-rescue) node tests/rc-browser.cjs ;;
            threat-hide) node tests/house-threat-browser.cjs ;;
            emy-emergency) node tests/emy-emergency-browser.cjs ;;
            mobile-input) node tests/house-input-browser.cjs ;;
            3d-production) node tests/house-css-production-browser.cjs ;;
            emy-mobile|emy-desktop|emy-webkit) node tests/emy-abilities-browser.cjs ;;
            altar) node tests/emy-abilities-browser.cjs ;;
            lois-portrait) node tests/lois-ps2-browser.cjs ;;
            subtle-glows) node tests/visual-glow-browser.cjs && node tests/pursuer-shadow-browser.cjs ;;
          esac
      - name: Capturas y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vale-v2-${{ matrix.scenario }}
          path: artifacts/
          if-no-files-found: ignore

  performance-audit:
    if: github.head_ref == 'feature/v31-telefono-historia-final-perf'
    uses: ./.github/workflows/v31-size.yml

  v32-frame-comparison:
    name: V3.2 vs main — fotogramas reales
    if: github.head_ref == 'feature/v32-cinematic-animations' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: eb0bf41d698ccd26cd3c982cac09fdc719c89a26
          path: baseline-v31
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            baseline-v31/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: baseline-v31
      - run: npx playwright install chromium --with-deps
      - name: V3.1 desplegada — escenas idénticas
        run: node tests/house-frame-benchmark.cjs baseline-v31 frame-v31.json
      - name: V3.2 — mismas escenas y resolución
        run: node tests/house-frame-benchmark.cjs . frame-v32.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-real-frame-comparison
          path: frame-v*.json
