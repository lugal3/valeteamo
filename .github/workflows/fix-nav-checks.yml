name: Probar navegación, arte y controles
on:
  push:
    branches: [fix/casa-controles-y-portada-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: node tests/demo-browser.cjs
      - run: npm run test:browser
      - name: Guardar capturas de portada, casa y rescate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valeteamo-v2-visual
          path: demo-screenshots/
          if-no-files-found: ignore
