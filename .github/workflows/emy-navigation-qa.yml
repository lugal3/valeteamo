name: Emy — navegación y refugios (sin publicar)
on:
  push:
    branches: [feature/v3-hud-interaccion-hop]
    paths:
      - 'src/lab/emy-companion.js'
      - 'src/lab/pursuer.js'
      - 'src/lab/emy-rescue.js'
      - 'src/lab/world.js'
      - 'src/lab/basement.js'
      - 'src/lab/house-layout.js'
      - 'src/lab/house.js'
      - 'tests/emy-*.cjs'
      - '.github/workflows/emy-navigation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emy-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refugio bajo escalera y salida del sótano
        run: node tests/emy-hide-independence.cjs
      - name: Seguimiento, autonomía y recuperación
        run: |
          node tests/emy-companion.cjs
          node tests/emy-autonomy.cjs
      - name: Distracciones, rutas y escaneo
        run: node tests/emy-abilities-noise.cjs
      - name: Empaquetar código de simulación para diagnóstico reproducible
        if: always()
        run: |
          git ls-files -z 'src/*.js' 'src/*.ts' 'src/*.tsx' 'src/**/*.js' 'src/**/*.ts' 'src/**/*.tsx' 'tests/*.cjs' 'tests/**/*.cjs' package.json | tar --null -czf emy-navigation-source.tar.gz -T -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emy-navigation-source
          path: emy-navigation-source.tar.gz
          retention-days: 3
