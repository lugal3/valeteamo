name: Publicar Valeteamo en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  verificar-y-publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Ejecutar pruebas de rendimiento
        run: npm run test:perf
      - name: Instalar FFmpeg para distribución sin pérdida
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compilar web optimizada
        env:
          VALE_REQUIRE_FLAC: '1'
        run: npm run build
      - name: Verificar recursos comprimidos antes de publicar
        run: node scripts/assert-flac-dist.mjs dist
      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VALEFC }}
          projectId: valefc
          channelId: live
